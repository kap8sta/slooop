<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOMP Chess Test Stub</title>
    <!-- STOMP.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <!-- jQuery, Chess.js та Chessboard.js -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .row { display: flex; gap: 10px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-connect { background: #28a745; color: white; }
        .btn-disconnect { background: #dc3545; color: white; }
        .btn-send { background: #007bff; color: white; width: 100%; margin-top: 10px; }
        .status { font-weight: bold; margin-left: 5px; }
        .status.connected { color: #28a745; }
        .status.disconnected { color: #dc3545; }
        .grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; margin-top: 20px; }
        .panel { border: 1px solid #ddd; padding: 15px; border-radius: 4px; background: #fafafa; }
        #log { height: 200px; overflow-y: auto; background: #222; color: #00ff00; padding: 10px; font-family: monospace; border-radius: 4px; font-size: 12px; }
        .log-in { color: #00d2ff; }
        .log-out { color: #ffc107; }
        .log-err { color: #ff4d4d; }
        #board { width: 100%; margin: 0 auto; }
        .info-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; background: #e0e0e0; }

        /* Спеціальні стилі для блоку гравців */
        .player-card {
            padding: 8px 12px;
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-card.active-turn {
            border: 2px solid #28a745;
            background: #eafaf1;
        }
        .color-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #000;
            margin-right: 6px;
        }
        .dot-white { background-color: #ffffff; }
        .dot-black { background-color: #000000; }
    </style>
</head>
<body>

<div class="container">
    <h2>STOMP WebSocket Тестер (Оновлення через Room Object)</h2>

    <!-- Налаштування підключення та топіків -->
    <div class="panel" style="margin-bottom: 20px;">
        <div class="form-group">
            <label for="wsUrl">1. Ендпоїнт підключення (WebSocket Endpoint):</label>
            <input type="text" id="wsUrl" value="ws://localhost:8080/ws">
        </div>

        <div class="form-group">
            <label for="topicUrl">2. Шлях для підписки (Topic / Destination):</label>
            <input type="text" id="topicUrl" value="/topic/rooms/1">
        </div>

        <div class="form-group">
            <label for="appUrl">3. Шлях для відправки ходу:</label>
            <input type="text" id="appUrl" value="/app/rooms/1/move">
        </div>

        <div class="row">
            <button id="btnConnect" class="btn-connect" onclick="connect()">Підключитись та Підписатись</button>
            <button id="btnDisconnect" class="btn-disconnect" onclick="disconnect()" style="display:none;">Відключитись</button>
            <div style="align-self: center;">Статус: <span id="statusLabel" class="status disconnected">Вимкнено</span></div>
        </div>
    </div>

    <div class="grid">
        <!-- Ліва колонка: Інформація про кімнату та Шахівниця -->
        <div class="panel">
            <h3>Стан Кімнати</h3>

            <!-- Другий гравець (Зверху) -->
            <div id="player2Card" class="player-card">
                <div>
                    <span id="player2ColorDot" class="color-dot dot-black"></span>
                    <strong id="player2Name">Очікування...</strong>
                </div>
                <small id="player2Role">(Чорні)</small>
            </div>

            <!-- Шахова дошка -->
            <div id="board"></div>

            <!-- Перший гравець (Знизу) -->
            <div id="player1Card" class="player-card">
                <div>
                    <span id="player1ColorDot" class="color-dot dot-white"></span>
                    <strong id="player1Name">Очікування...</strong>
                </div>
                <small id="player1Role">(Білі)</small>
            </div>

            <!-- Інформаційна панель під дошкою -->
            <div style="margin-top: 10px;">
                <small>Стан кімнати: </small><span id="gameStatus" class="info-badge">WAITING</span>
            </div>
            <div style="margin-top: 5px;">
                <small>Зараз ходить: </small><strong id="activeTurnDisplay" style="color: #007bff;">-</strong>
            </div>
            <div style="margin-top: 5px; font-size: 11px; word-break: break-all; color: #555;">
                <strong>Current FEN:</strong> <span id="currentFenDisplay">rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1</span>
            </div>
        </div>

        <!-- Права колонка: Форма відправки та Логи -->
        <div>
            <div class="panel" style="margin-bottom: 20px;">
                <h3>Відправити хід (move)</h3>
                <div class="row">
                    <div class="form-group" style="flex: 1;">
                        <label for="moveFrom">Звідки (from):</label>
                        <input type="text" id="moveFrom" value="e2">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="moveTo">Куди (to):</label>
                        <input type="text" id="moveTo" value="e4">
                    </div>
                </div>
                <div class="form-group">
                    <label for="movePromotion">Перетворення (promotion):</label>
                    <input type="text" id="movePromotion" placeholder="Необов'язково (напр. q)">
                </div>
                <button id="btnSend" class="btn-send" onclick="sendMove()" disabled>Надіслати через STOMP</button>
            </div>

            <div class="panel">
                <h3>Лог STOMP повідомлень</h3>
                <div id="log"></div>
                <button onclick="document.getElementById('log').innerHTML = ''" style="margin-top: 10px; background: #6c757d; color: white;">Очистити лог</button>
            </div>
        </div>
    </div>
</div>

<script>
    let stompClient = null;
    let subscription = null;
    let board = null;

    const logDiv = document.getElementById('log');
    const statusLabel = document.getElementById('statusLabel');
    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const btnSend = document.getElementById('btnSend');
    const gameStatus = document.getElementById('gameStatus');
    const currentFenDisplay = document.getElementById('currentFenDisplay');
    const activeTurnDisplay = document.getElementById('activeTurnDisplay');

    // Елементи гравців
    const player1Name = document.getElementById('player1Name');
    const player1Role = document.getElementById('player1Role');
    const player1ColorDot = document.getElementById('player1ColorDot');
    const player1Card = document.getElementById('player1Card');

    const player2Name = document.getElementById('player2Name');
    const player2Role = document.getElementById('player2Role');
    const player2ColorDot = document.getElementById('player2ColorDot');
    const player2Card = document.getElementById('player2Card');

    $(document).ready(function() {
        board = Chessboard('board', {
            position: 'start',
            draggable: false,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });
    });

    function log(message, type = '') {
        const time = new Date().toLocaleTimeString();
        let className = '';
        if (type === 'in') className = 'log-in';
        if (type === 'out') className = 'log-out';
        if (type === 'err') className = 'log-err';

        logDiv.innerHTML += `<div class="${className}">[${time}] ${message}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function connect() {
        const url = document.getElementById('wsUrl').value;
        const topic = document.getElementById('topicUrl').value;

        log(`Ініціалізація STOMP клієнта для ${url}...`);

        stompClient = Stomp.client(url);

        stompClient.debug = function(str) {
            console.log("STOMP Debug:", str);
        };

        stompClient.connect({},
            function (frame) {
                log('STOMP протокол успішно піднято!', 'in');
                statusLabel.textContent = 'Підключено';
                statusLabel.className = 'status connected';
                btnConnect.style.display = 'none';
                btnDisconnect.style.display = 'inline-block';
                btnSend.disabled = false;

                log(`Підписка на топік: ${topic}...`);
                subscription = stompClient.subscribe(topic, function (message) {
                    log(`ОТРИМАНО З ТОПІКА: ${message.body}`, 'in');

                    try {
                        const parsed = JSON.parse(message.body);

                        // Парсимо об'єкт Room (якщо бек повертає wrapper {"type": "...", "payload": Room} або чистий Room)
                        const room = parsed.payload ? parsed.payload : parsed;

                        if (room && typeof room === 'object') {
                            updateRoomUI(room);
                        }
                    } catch(e) {
                        log(`Помилка розбору JSON: ${e.message}`, 'err');
                    }
                });
            },
            function (error) {
                log(`Помилка STOMP: ${error}`, 'err');
                handleDisconnectState();
            }
        );
    }

    // ГОЛОВНА ФУНКЦІЯ ОНОВЛЕННЯ СТАНУ З ОБ'ЄКТА ROOM
    function updateRoomUI(room) {
        // 1. Оновлення FEN та дошки
        if (room.currentFen) {
            board.position(room.currentFen);
            currentFenDisplay.textContent = room.currentFen;
            log(`Дошку оновлено на FEN: ${room.currentFen}`, 'in');
        }

        // 2. Стан кімнати
        if (room.roomState) {
            gameStatus.textContent = room.roomState;
        }

        // 3. Перший гравець
        if (room.firstPlayer) {
            player1Name.textContent = room.firstPlayer.username || `User #${room.firstPlayer.id}`;
            const color = room.firstPlayer.color || 'WHITE';
            player1Role.textContent = `(${color})`;
            player1ColorDot.className = `color-dot dot-${color.toLowerCase()}`;
        } else {
            player1Name.textContent = 'Очікування...';
        }

        // 4. Другий гравець
        if (room.secondPlayer) {
            player2Name.textContent = room.secondPlayer.username || `User #${room.secondPlayer.id}`;
            const color = room.secondPlayer.color || 'BLACK';
            player2Role.textContent = `(${color})`;
            player2ColorDot.className = `color-dot dot-${color.toLowerCase()}`;
        } else {
            player2Name.textContent = 'Очікування...';
        }

        // 5. Індикація того, хто зараз ходить (activeColor)
        if (room.activeColor) {
            activeColor = room.activeColor.toUpperCase();
            activeTurnDisplay.textContent = activeColor === 'WHITE' ? 'Білі' : 'Чорні';

            // Підсвічуємо картку активного гравця зеленим бордером
            player1Card.classList.remove('active-turn');
            player2Card.classList.remove('active-turn');

            if (room.firstPlayer && (room.firstPlayer.color || 'WHITE').toUpperCase() === activeColor) {
                player1Card.classList.add('active-turn');
            } else if (room.secondPlayer && (room.secondPlayer.color || 'BLACK').toUpperCase() === activeColor) {
                player2Card.classList.add('active-turn');
            }
        }
    }

    function disconnect() {
        if (stompClient !== null) {
            if (subscription !== null) {
                subscription.unsubscribe();
                subscription = null;
            }
            stompClient.disconnect(function() {
                log("STOMP клієнт відключено.");
                handleDisconnectState();
            });
        }
    }

    function handleDisconnectState() {
        statusLabel.textContent = 'Вимкнено';
        statusLabel.className = 'status disconnected';
        btnConnect.style.display = 'inline-block';
        btnDisconnect.style.display = 'none';
        btnSend.disabled = true;
        stompClient = null;
    }

    function sendMove() {
        if (!stompClient || !stompClient.connected) {
            log('Помилка: немає активного STOMP з\'єднання!', 'err');
            return;
        }

        const appDestination = document.getElementById('appUrl').value;
        const from = document.getElementById('moveFrom').value;
        const to = document.getElementById('moveTo').value;
        const promotion = document.getElementById('movePromotion').value;

        const payload = {
            from: from,
            to: to
        };

        if (promotion.trim() !== "") {
            payload.promotion = promotion;
        }

        const jsonString = JSON.stringify(payload);

        stompClient.send(appDestination, {}, jsonString);
        log(`НАДІСЛАНО на ${appDestination}: ${jsonString}`, 'out');
    }
</script>
</body>
</html>
